{% extends "base.html" %}
{% block titulo %}Nueva reserva{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">Nueva reserva</h1>
    <div class="card"><div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_formulario.html" with form=form %}
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Confirmar reserva</button>
          <a class="btn btn-outline-secondary" href="{% url 'reservas:espacios' %}">Cancelar</a>
        </div>
      </form>
    </div></div>
    <p class="text-muted small mt-2"><i class="bi bi-info-circle"></i> El sistema no permite reservar un horario que se tope con otra reserva.</p>
  </div>
</div>
{% endblock %}
