{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}

{% block contenido %}
<nav aria-label="Ruta"><ol class="breadcrumb">
  <li class="breadcrumb-item"><a href="{% url 'cuentas:perfil' %}">Mi perfil</a></li>
  <li class="breadcrumb-item active" aria-current="page">Cambiar contraseña</li>
</ol></nav>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">Cambiar contraseña</h1>
    <div class="card"><div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_formulario.html" with form=form %}
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Cambiar contraseña</button>
          <a class="btn btn-outline-secondary" href="{% url 'cuentas:perfil' %}">Cancelar</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
