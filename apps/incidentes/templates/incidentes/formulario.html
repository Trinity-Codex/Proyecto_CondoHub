{% extends "base.html" %}
{% block titulo %}Reportar incidente{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="h3 mb-3">Reportar incidente</h1>
    <div class="card"><div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_formulario.html" with form=form %}
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Enviar reporte</button>
          <a class="btn btn-outline-secondary" href="{% url 'incidentes:lista' %}">Cancelar</a>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
