{# Insignia de la situación de una unidad en el reporte (Issue #80). Uso: {% include "gastos/_situacion.html" %} (con "fila") #}
{% if fila.es_morosa %}<span class="insignia insignia-moroso">Morosa</span>
{% elif fila.saldo %}<span class="insignia insignia-con-deuda">Pendiente</span>
{% else %}<span class="insignia insignia-al-dia">Al día</span>{% endif %}
