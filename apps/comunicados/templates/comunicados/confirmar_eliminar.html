{% extends "base.html" %}
{% block titulo %}Eliminar comunicado{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger"><div class="card-body">
      <h1 class="h4">¿Eliminar este comunicado?</h1>
      <p>Se eliminará <strong>«{{ object.titulo }}»</strong>. Esta acción no se puede deshacer.</p>
      <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Sí, eliminar</button>
        <a class="btn btn-outline-secondary" href="{{ object.get_absolute_url }}">Cancelar</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
